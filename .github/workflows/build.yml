name: Build & E2E
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Mac 에서는 설치 파일 빌드 대신 기능 parity E2E 만 수행 (설치 환경과 개발 환경 동일 동작 보증)
  e2e-mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Next.js static export
        run: npm run build:next

      - name: Seed smoke fixture
        run: npm run seed:smoke

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Mac, dev path)
        env:
          CI: 'true'
          MYH_SMOKE: '1'
        run: npx playwright test
        timeout-minutes: 15

      - name: Upload Mac E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mac-${{ github.sha }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 30

  build-win:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      # postinstall이 better-sqlite3를 Electron ABI로 빌드 (|| true 없음 → 실패 시 early fail)

      - name: Build Next.js static export
        run: npm run build:next

      - name: Seed smoke fixture
        # seed:smoke 스크립트가 Node ABI로 리빌드 → seed → Electron ABI 복원
        run: npm run seed:smoke

      # 릴리스 seed DB (전 종목 · 10년 데이터, gzip 압축) 다운로드 후 해제
      # - GitHub Release 태그 "seed-latest" 의 release-warehouse.sqlite.gz 에셋
      # - 없으면 skip (build 는 계속 진행, installer 는 SEED 폴백 상태로 빌드됨)
      - name: Download release seed DB
        id: seed
        continue-on-error: true
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/seed-latest/release-warehouse.sqlite.gz"
          $gz = "test/fixtures/release-warehouse.sqlite.gz"
          $dest = "test/fixtures/release-warehouse.sqlite"
          try {
            Invoke-WebRequest -Uri $url -OutFile $gz -Headers @{ "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}" } -ErrorAction Stop
            $szGz = (Get-Item $gz).Length / 1MB
            Write-Host "✓ gzipped seed 다운로드 완료: $([math]::Round($szGz, 1)) MB"
            # gzip 해제
            $inStream = [System.IO.File]::OpenRead($gz)
            $outStream = [System.IO.File]::Create($dest)
            $gzipStream = New-Object System.IO.Compression.GZipStream($inStream, [System.IO.Compression.CompressionMode]::Decompress)
            $gzipStream.CopyTo($outStream)
            $gzipStream.Close(); $outStream.Close(); $inStream.Close()
            Remove-Item $gz
            $sz = (Get-Item $dest).Length / 1MB
            Write-Host "✓ seed 해제 완료: $([math]::Round($sz, 1)) MB"
          } catch {
            Write-Host "⚠ release seed 없음 — SEED 폴백으로 빌드"
            Write-Host $_
          }

      - name: Package Windows NSIS installer
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: 'true'
          MYH_SMOKE: '1'
        run: npx playwright test
        timeout-minutes: 15

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyHeroicMun-Setup-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: ignore

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.sha }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 30
