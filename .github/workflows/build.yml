name: Build & E2E
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Windows 전용: 실 사용 환경(Win NSIS installer)에서만 E2E 가 의미 있음. Mac 잡은 제거됨.
  build-win:
    # windows-latest 가 VS 18 로 업데이트되며 node-gyp 가 better-sqlite3 리빌드 실패 → VS 17 환경 고정
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      # postinstall이 better-sqlite3를 Electron ABI로 빌드 (|| true 없음 → 실패 시 early fail)

      - name: Build Next.js static export
        run: npm run build:next

      - name: Seed smoke fixture
        # seed:smoke 스크립트가 Node ABI로 리빌드 → seed → Electron ABI 복원
        run: npm run seed:smoke

      # 릴리스 seed DB (전 종목 · 10년 데이터, gzip 압축) 다운로드 후 해제
      # Private 레포 지원: gh CLI 로 API 호출 → gzip 해제 → electron-builder 가 번들
      - name: Download release seed DB
        id: seed
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $gz = "test/fixtures/release-warehouse.sqlite.gz"
          $dest = "test/fixtures/release-warehouse.sqlite"
          try {
            gh release download seed-latest --repo ${{ github.repository }} --pattern "release-warehouse.sqlite.gz" --output $gz
            if (!(Test-Path $gz)) { throw "gh release download 결과 파일 없음" }
            $szGz = (Get-Item $gz).Length / 1MB
            Write-Host "✓ gzipped seed 다운로드 완료: $([math]::Round($szGz, 1)) MB"
            # gzip 해제
            $inStream = [System.IO.File]::OpenRead($gz)
            $outStream = [System.IO.File]::Create($dest)
            $gzipStream = New-Object System.IO.Compression.GZipStream($inStream, [System.IO.Compression.CompressionMode]::Decompress)
            $gzipStream.CopyTo($outStream)
            $gzipStream.Close(); $outStream.Close(); $inStream.Close()
            Remove-Item $gz
            $sz = (Get-Item $dest).Length / 1MB
            Write-Host "✓ seed 해제 완료: $([math]::Round($sz, 1)) MB"
          } catch {
            Write-Host "⚠ release seed 없음 — SEED 폴백으로 빌드"
            Write-Host $_
          }

      - name: Package Windows NSIS installer
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 회귀 방지: win-unpacked 에 release DB 가 실제로 번들됐는지, 크기가 900MB 이상인지 검증
      # (이 검증이 없으면 seed 다운로드 단계가 continue-on-error 로 조용히 실패해도 CI 는 green)
      - name: Verify release seed bundled in installer
        shell: pwsh
        run: |
          $p = "dist/win-unpacked/resources/app.asar.unpacked/test/fixtures/release-warehouse.sqlite"
          if (!(Test-Path $p)) { throw "번들 누락: $p 없음 — seed 다운로드 또는 electron-builder files 패턴 확인" }
          $sz = (Get-Item $p).Length / 1MB
          Write-Host "✓ 번들 release DB: $([math]::Round($sz, 1)) MB"
          if ($sz -lt 900) { throw "번들 release DB 크기 이상: ${sz}MB (기대: ≥900MB). 다운로드 실패 가능성" }

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: 'true'
          MYH_SMOKE: '1'
        run: npx playwright test --project=default
        timeout-minutes: 15

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyHeroicMun-Setup-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: ignore

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.sha }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 30

  # 실제 NSIS installer 로 silent install → 설치된 앱 대상 E2E
  # tag push (v*) 에서만 실행. 릴리스 직전 최종 검증용.
  e2e-win-installed:
    needs: build-win
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MyHeroicMun-Setup-${{ github.sha }}
          path: installer

      - name: Silent install (/S)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/*.exe | Select-Object -First 1
          if (!$setup) { throw "installer .exe 없음" }
          Write-Host "설치 시작: $($setup.FullName) ($([math]::Round($setup.Length/1MB, 1)) MB)"
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "설치 종료 code=$($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "installer 종료 코드 $($proc.ExitCode)" }

          # productName="나만의 영웅문" 이므로 한글 경로가 기본. 후보 전부 탐색.
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\나만의 영웅문\나만의 영웅문.exe",
            "$env:LOCALAPPDATA\Programs\my-heroic-mun\나만의 영웅문.exe",
            "$env:PROGRAMFILES\나만의 영웅문\나만의 영웅문.exe",
            "${env:PROGRAMFILES(X86)}\나만의 영웅문\나만의 영웅문.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$exe) {
            Write-Host "후보 경로 전부 부재. 설치 디렉토리 강제 탐색:"
            Get-ChildItem -Path "$env:LOCALAPPDATA\Programs","$env:PROGRAMFILES","${env:PROGRAMFILES(X86)}" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "영웅문|heroic" } | Select-Object FullName, Length
            throw "설치된 exe 를 찾을 수 없음"
          }
          Write-Host "✓ 설치된 exe: $exe"
          echo "MYH_INSTALLED_EXE=$exe" >> $env:GITHUB_ENV

      - name: Run installed E2E (inst-* 스위트)
        env:
          CI: 'true'
        run: npx playwright test --project=installed
        timeout-minutes: 15

      - name: Silent uninstall
        if: always()
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\나만의 영웅문\Uninstall 나만의 영웅문.exe",
            "$env:LOCALAPPDATA\Programs\my-heroic-mun\Uninstall 나만의 영웅문.exe",
            "$env:PROGRAMFILES\나만의 영웅문\Uninstall 나만의 영웅문.exe"
          )
          $uninst = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($uninst) {
            Write-Host "uninstall: $uninst"
            Start-Process -FilePath $uninst -ArgumentList '/S' -Wait
          } else {
            Write-Host "uninstaller 못 찾음 (CI 러너 재사용 안 되므로 무시 가능)"
          }

      - name: Upload installed E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-installed-${{ github.sha }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 30
